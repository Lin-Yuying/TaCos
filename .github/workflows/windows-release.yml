name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Secrets cannot be used in step `if` conditions; expose it here and test the env var.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # H-DESKTOP-UPDATE-08: two-stage SignPath when configured (exe then installer).
      # Per-user NSIS (perMachine=false) + asInvoker keeps silent updates from needing UAC.
      - name: Build Next.js and the embedded server
        run: |
          npm run build
          npm run server:bundle -- --target=win32-x64

      - name: Package Windows app directory
        run: npx electron-builder --win --x64 --dir --publish never --config electron/builder.standalone.json

      - name: Upload unpacked app executable for signing
        id: upload-app
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG != ''
        uses: actions/upload-artifact@v7
        with:
          name: tacos-windows-x64-app-unsigned
          path: release-standalone/win-unpacked/TaCos.exe
          if-no-files-found: error
          retention-days: 7

      - name: Sign app executable with SignPath
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app

      - name: Replace unpacked executable with the signed build
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG != ''
        shell: bash
        run: |
          set -euo pipefail
          signed=$(find signed-app -name 'TaCos.exe' -print -quit)
          test -n "$signed"
          cp "$signed" release-standalone/win-unpacked/TaCos.exe
          ls -l release-standalone/win-unpacked/TaCos.exe

      - name: Build NSIS installer from the packaged directory
        run: npx electron-builder --win --x64 --prepackaged release-standalone/win-unpacked --publish never --config electron/builder.standalone.json

      - name: Upload unsigned installer
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: tacos-windows-x64-unsigned
          path: release-standalone/TaCos-Local-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Sign installer with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Collect the final installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          file=$(find signed -name '*.exe' -print -quit 2>/dev/null || true)
          if [ -z "$file" ]; then
            file=$(find release-standalone -maxdepth 1 -name 'TaCos-Local-Setup-*.exe' -print -quit)
          fi
          cp "$file" out/
          ls -l out

      - name: Write Windows updater metadata
        shell: bash
        run: |
          set -euo pipefail
          exe=$(find out -maxdepth 1 -name '*.exe' -print -quit)
          npx tsx scripts/write-desktop-updater-metadata.ts --platform win --file "$exe" --out out

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: tacos-windows-x64
          path: |
            out/*.exe
            out/latest.yml
          if-no-files-found: error
          retention-days: 7

      - name: Record signing status
        shell: bash
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ]; then
            {
              echo "### Signed installer"
              echo "SignPath signed the following files:"
              echo '```'
              find signed-app signed -name '*.exe' -print 2>/dev/null || find signed -name '*.exe' -print
              echo '```'
              echo
              echo "NSIS is per-user by default (\`perMachine: false\`) with \`asInvoker\`, so silent app updates should not raise an extra UAC prompt."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Unsigned build"
              echo "SignPath is not configured, so this installer is **unsigned**. Windows 11 Smart App Control blocks unsigned installers."
              echo "See [docs/windows-signing.md](https://github.com/Lin-Yuying/tacos/blob/main/docs/windows-signing.md)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  macos:
    # macos-14 was retired by GitHub on 2026-11-02 and no longer schedules runners.
    runs-on: macos-15
    env:
      # No Apple Developer certificate is configured; skip identity discovery instead of failing.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the local (embedded server) DMG
        run: npm run desktop:standalone:mac

      - name: Write macOS updater metadata
        shell: bash
        run: |
          set -euo pipefail
          zip=$(find release-standalone -maxdepth 1 -name '*-mac.zip' -print -quit)
          if [ -z "$zip" ]; then
            zip=$(find release-standalone -maxdepth 1 -name '*.zip' -print -quit)
          fi
          test -n "$zip"
          npx tsx scripts/write-desktop-updater-metadata.ts --platform mac --file "$zip" --out release-standalone
          ls -l release-standalone/*.zip release-standalone/latest-mac.yml

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v7
        with:
          name: tacos-macos-arm64
          path: |
            release-standalone/TaCos-Local-*.dmg
            release-standalone/*.zip
            release-standalone/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  linux:
    runs-on: ubuntu-24.04
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js and the embedded server
        run: |
          npm run build
          npm run server:bundle -- --target=linux-x64

      - name: Pack the team server
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mkdir -p out
          tar -czf "out/TaCos-Server-${version}-linux-x64.tar.gz" -C dist/server payload -C "$PWD" deploy

      - name: Build the Linux desktop app
        run: npx electron-builder --linux AppImage --x64 --publish never --config electron/builder.standalone.json

      - name: Upload Linux files
        uses: actions/upload-artifact@v7
        with:
          name: tacos-linux-x64
          path: |
            out/*.tar.gz
            release-standalone/*.AppImage
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Download Windows installer
        uses: actions/download-artifact@v7
        with:
          name: tacos-windows-x64
          path: dist/windows

      - name: Download macOS disk image
        uses: actions/download-artifact@v7
        with:
          name: tacos-macos-arm64
          path: dist/macos

      - name: Download Linux files
        uses: actions/download-artifact@v7
        with:
          name: tacos-linux-x64
          path: dist/linux

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          mapfile -t assets < <(ls dist/windows/*.exe dist/windows/latest.yml dist/macos/*.dmg dist/macos/*.zip dist/macos/latest-mac.yml dist/linux/out/*.tar.gz dist/linux/release-standalone/*.AppImage 2>/dev/null)
          # Fail if required updater metadata is missing.
          test -f dist/windows/latest.yml
          test -f dist/macos/latest-mac.yml
          ls dist/macos/*.zip >/dev/null
          printf 'Releasing %s with:\n' "$tag"
          printf '  %s\n' "${assets[@]}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            exit 0
          fi

          gh release create "$tag" "${assets[@]}" \
            --title "TaCos $tag" \
            --generate-notes

          {
            cat <<'EOF'
          > **These builds are unsigned.** Windows 11 Smart App Control blocks the unsigned installer. The macOS app is ad-hoc signed but not notarized, so Gatekeeper asks for confirmation on first launch. Code signing is tracked in [docs/windows-signing.md](https://github.com/Lin-Yuying/tacos/blob/main/docs/windows-signing.md).

          ## Downloads

          | Platform | File |
          | --- | --- |
          | Windows x64 | `TaCos-Local-Setup-*.exe` |
          | Windows updater feed | `latest.yml` |
          | macOS (Apple silicon) | `TaCos-Local-*-arm64.dmg` |
          | macOS updater zip | `*-mac.zip` |
          | macOS updater feed | `latest-mac.yml` |
          | Linux desktop app | `*.AppImage` |
          | Team server (Linux x64) | `TaCos-Server-*-linux-x64.tar.gz` |

          Both installers run TaCos with its own local server and SQLite database, so no account or cloud service is involved.

          **macOS:** drag TaCos into Applications and launch it once. If macOS says it cannot verify the app, allow it under **System Settings → Privacy & Security → Open Anyway**.

          **Windows:** the installer is unsigned, so Smart App Control blocks it. Use the browser against a running TaCos server until a signed build is available.
          EOF
            echo
            gh release view "$tag" --json body -q .body
          } > release-notes.md
          gh release edit "$tag" --notes-file release-notes.md
