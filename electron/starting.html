<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Starting Tacos</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --text: #0d0d0d;
        --muted: #5d5d5d;
        --faint: #8f8f8f;
        --border: #e5e5e5;
        --accent: #0d0d0d;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(1200px 600px at 50% -10%, #f7f7f7 0%, var(--bg) 55%);
        color: var(--text);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: -0.005em;
        -webkit-user-select: none;
        user-select: none;
      }
      .drag {
        position: fixed;
        inset: 0 0 auto 0;
        height: 44px;
        -webkit-app-region: drag;
      }
      .wrap {
        width: 380px;
        max-width: 88vw;
        text-align: center;
      }
      .logo {
        width: 48px;
        height: 48px;
        margin: 0 auto 18px;
      }
      .logo img {
        width: 100%;
        height: 100%;
        display: block;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .lede {
        margin-top: 6px;
        font-size: 13px;
        color: var(--muted);
      }
      .bar {
        position: relative;
        height: 3px;
        margin: 26px auto 0;
        width: 180px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--border);
      }
      .bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: var(--accent);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      .hint {
        margin-top: 24px;
        font-size: 12px;
        color: var(--faint);
      }
    </style>
  </head>
  <body>
    <div class="drag"></div>
    <div class="wrap">
      <div class="logo"><img src="assets/otter-line.png" alt="" /></div>
      <h1>Starting Tacos…</h1>
      <p class="lede">Booting the local server and opening your workspace.</p>
      <div class="bar"></div>
      <p class="hint">The first launch takes a few seconds while the database is created.</p>
    </div>
  </body>
</html>
